<section aria-label="Your photographs" [attr.aria-busy]="loading()">
  <div class="grid">
    @for (item of items(); track item.id) {
      <lp-photograph-card
        [destination]="detailBase() + '/' + item.id"
        [title]="item.title"
        [previewUrl]="item.previewUrl"
        [createdAt]="item.createdAt"
        [width]="item.width"
        [height]="item.height"
      />
    }
  </div>
  @if (loaded() && !items().length && !failed()) {
    <div class="empty">
      <h2>No photographs yet</h2>
      <p>Your saved photographs will appear here.</p>
    </div>
  }
  @if (failed()) {
    <p role="alert">My Work could not be loaded. Try again.</p>
    <button type="button" (click)="load()">Try again</button>
  } @else if (loading()) {
    <p role="status">Loading photographs…</p>
  } @else if (nextCursor()) {
    <button type="button" (click)="load()">Load more photographs</button>
  }
</section>
