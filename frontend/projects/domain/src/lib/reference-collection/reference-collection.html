<section aria-label="Your references" [attr.aria-busy]="loading()">
  <div class="grid">
    @for (item of items(); track item.id) {
      <lp-photograph-card
        [destination]="'/inspiration/' + item.id"
        [title]="item.title"
        [status]="item.previewUrl ? 'Saved reference' : 'Link-only reference'"
        [previewUrl]="item.previewUrl"
        [createdAt]="item.createdAt"
        [width]="item.width"
        [height]="item.height"
      />
    }
  </div>
  @if (loaded() && !items().length && !failed()) {
    <div class="empty">
      <h2 #emptyHeading tabindex="-1">No references yet</h2>
      <p>Your saved inspiration will appear here.</p>
    </div>
  }
  @if (failed()) {
    <p role="alert">Inspiration could not be loaded. Try again.</p>
    <button #retryButton type="button" (click)="load(true)">Retry loading references</button>
  } @else if (loading()) {
    <p role="status">Loading references…</p>
  } @else if (nextCursor()) {
    <button type="button" (click)="load()">Load more references</button>
  }
</section>
