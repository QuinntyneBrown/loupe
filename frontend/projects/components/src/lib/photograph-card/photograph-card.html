<article>
  <a #link [routerLink]="destination()">
    <img
      [src]="previewUrl()"
      alt=""
      [width]="width()"
      [height]="height()"
      loading="lazy"
      decoding="async"
    />
    <h2>{{ title() }}</h2>
  </a>
  <div>
    <time [attr.datetime]="createdAt()">{{ createdAt() | date: 'mediumDate' }}</time>
  </div>
</article>
