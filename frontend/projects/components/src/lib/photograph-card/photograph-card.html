<article>
  <a #link [routerLink]="destination()" [attr.aria-label]="title()">
    @if (previewUrl()) {
      <img
        [src]="previewUrl()"
        alt=""
        [attr.width]="width()"
        [attr.height]="height()"
        loading="lazy"
        decoding="async"
      />
    } @else {
      <span class="placeholder">Link-only reference</span>
    }
    <h2>{{ title() }}</h2>
  </a>
  <div>
    <time [attr.datetime]="createdAt()">{{ createdAt() | date: 'mediumDate' }}</time>
    <p>{{ status() }}</p>
  </div>
</article>
