<div class="frame">
  <iframe
    [src]="source()"
    [title]="title()"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="
      accelerometer;
      autoplay;
      clipboard-write;
      encrypted-media;
      gyroscope;
      picture-in-picture;
      web-share;
    "
    allowfullscreen
  ></iframe>
</div>
