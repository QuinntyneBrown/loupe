<dialog
  #modal
  class="lp-dialog"
  aria-labelledby="add-images-title"
  (cancel)="cancel($event)"
  (click)="backdrop($event)"
>
  <div class="lp-dialog__panel">
    <header class="lp-dialog__header">
      <div>
        <h2 class="lp-dialog__title" id="add-images-title">{{ title() }}</h2>
      </div>
      <button class="lp-icon-button" type="button" aria-label="Close" (click)="cancel()">
        <svg class="lp-icon" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </header>
    <div class="lp-dialog__body">
      <lp-location-image-upload #queue [location]="location()" (saved)="saved.emit($event)" />
    </div>
    <footer class="lp-dialog__footer">
      @if (!queue.started()) {
        <span class="lp-dialog__privacy">
          <svg class="lp-icon lp-icon--sm" aria-hidden="true"><use href="#i-lock" /></svg>Private.
          Only you can see these.
        </span>
        <button class="lp-button lp-button--secondary" type="button" (click)="cancel()">
          Cancel
        </button>
        @if (queue.canUpload()) {
          <button class="lp-button lp-button--primary" type="button" (click)="queue.start()">
            Upload
          </button>
        }
      } @else {
        @if (queue.uploading()) {
          <button class="lp-button lp-button--secondary" type="button" (click)="cancelRemaining()">
            Cancel remaining
          </button>
        }
        <button
          class="lp-button lp-button--primary"
          type="button"
          [disabled]="queue.uploading()"
          (click)="done()"
        >
          Done
        </button>
      }
    </footer>
  </div>
</dialog>
