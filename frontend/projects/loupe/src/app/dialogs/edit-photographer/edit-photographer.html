<dialog
  #modal
  class="lp-dialog"
  aria-labelledby="edit-photographer-title"
  (cancel)="cancel($event)"
>
  <form class="lp-dialog__panel" (ngSubmit)="save()">
    <header class="lp-dialog__header">
      <h2 class="lp-dialog__title" id="edit-photographer-title">Edit details</h2>
      <button
        class="lp-icon-button"
        type="button"
        aria-label="Close"
        [disabled]="busy()"
        (click)="cancel()"
      >
        <svg class="lp-icon" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </header>
    <div class="lp-dialog__body">
      <div class="lp-form">
        <div class="fields">
          <div class="lp-field">
            <label class="lp-field__label" for="edit-name">Name</label
            ><input
              class="lp-input"
              id="edit-name"
              name="name"
              autofocus
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
              [disabled]="busy()"
            />
          </div>
          <div class="lp-field">
            <label class="lp-field__label" for="edit-url">Website</label
            ><input
              class="lp-input lp-input--mono"
              id="edit-url"
              name="url"
              type="url"
              [ngModel]="url()"
              (ngModelChange)="url.set($event)"
              [disabled]="busy()"
            />
            <p class="lp-field__hint">Changing the site re-reads it for a new summary.</p>
          </div>
        </div>
        <div class="lp-field">
          <label class="lp-field__label" for="edit-description">Description</label
          ><textarea
            class="lp-textarea"
            id="edit-description"
            name="description"
            rows="2"
            [ngModel]="description()"
            (ngModelChange)="description.set($event)"
            [disabled]="busy()"
          ></textarea>
        </div>
      </div>
      @if (error()) {
        <p role="alert">{{ error() }}</p>
      }
      @if (stale()) {
        <button
          class="lp-button lp-button--secondary"
          type="button"
          [disabled]="busy()"
          (click)="review()"
        >
          Review latest
        </button>
      } @else if (retryable()) {
        <button
          class="lp-button lp-button--secondary"
          type="button"
          [disabled]="busy()"
          (click)="save()"
        >
          Retry
        </button>
      }
    </div>
    <footer class="lp-dialog__footer">
      <button
        class="lp-button lp-button--secondary"
        type="button"
        [disabled]="busy()"
        (click)="cancel()"
      >
        Cancel</button
      ><button class="lp-button lp-button--primary" type="submit" [disabled]="busy() || stale()">
        {{ busy() ? 'Saving…' : 'Save' }}
      </button>
    </footer>
  </form>
</dialog>
