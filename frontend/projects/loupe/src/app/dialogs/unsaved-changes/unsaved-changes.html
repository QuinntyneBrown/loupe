<dialog
  #discardDialog
  aria-labelledby="discard-heading"
  aria-describedby="discard-description"
  (cancel)="cancelDiscard($event)"
  (keydown)="trapDiscardFocus($event)"
>
  <h2 id="discard-heading">Discard unsaved changes?</h2>
  <p id="discard-description">
    Keep editing to save your changes, or discard this unfinished edit.
    @if (warning(); as message) {
      {{ message }}
    }
  </p>
  <div class="actions">
    <button #keepButton type="button" autofocus (click)="finishDiscard(false)">Keep editing</button>
    <button #discardButton type="button" (click)="finishDiscard(true)">Discard</button>
  </div>
</dialog>
