<main id="main" tabindex="-1" class="lp-main">
  <a class="lp-back" routerLink="/inspiration"><svg class="lp-icon lp-icon--sm" aria-hidden="true"><use href="#i-chevron-left" /></svg>Back to Inspiration</a
  ><lp-reference-detail-panel [id]="id()" (discardRequested)="requestDiscard($event)" />
</main>
<lp-unsaved-changes
  [dirty]="dirty"
  [warning]="
    detail()?.saving()
      ? 'This save may finish after you leave. Reopen the reference to check its saved metadata.'
      : null
  "
/>
