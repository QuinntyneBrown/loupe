<main id="main" tabindex="-1" class="lp-main">
  <a class="lp-back" routerLink="/inspiration"><svg class="lp-icon lp-icon--sm" aria-hidden="true"><use href="#i-chevron-left" /></svg>Back to Inspiration</a>
  <h1 class="lp-title">Upload reference</h1>
  <lp-reference-image-panel (saved)="saved($event)" />
</main>
<lp-unsaved-changes
  [dirty]="dirty"
  [warning]="
    form()?.saving()
      ? 'This upload may finish after you leave. Check Inspiration before uploading it again.'
      : null
  "
/>
