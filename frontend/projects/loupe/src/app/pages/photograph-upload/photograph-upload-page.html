<main id="main" tabindex="-1">
  <a routerLink="/my-work">My Work</a>
  <h1>Upload photograph</h1>
  <lp-photograph-upload (saved)="saved($event)" />
</main>
<lp-unsaved-changes
  [dirty]="form()?.dirty() ?? false"
  [warning]="
    form()?.saving()
      ? 'This upload may finish after you leave. Check My Work before uploading it again.'
      : null
  "
/>
