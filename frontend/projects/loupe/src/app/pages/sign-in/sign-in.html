<main id="main" tabindex="-1">
  <a class="wordmark" href="/">Loupe</a>
  <p class="eyebrow">LOOK CLOSER. KEEP LEARNING.</p>
  <h1>A private space for your photography</h1>
  @if (failed) {
    <p role="alert">Sign-in could not be completed. Please try again.</p>
  }
  <p>
    Develop your eye through thoughtful photo critiques and a library of work that inspires you.
  </p>
  <button type="button" (click)="continue()">Continue to sign in</button>
  <p class="privacy">Your photographs, references, and notes are private to you.</p>
</main>
