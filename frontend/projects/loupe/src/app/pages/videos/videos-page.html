<main id="main" class="lp-main" tabindex="-1">
  <lp-unsaved-changes [dirty]="dirty" />
  <lp-video-collection (addRequested)="adding.set(true)" (editRequested)="editing.set($event)" />
  @if (adding() || editing()) {
    <lp-video-form
      [video]="editing()"
      (saved)="saved($event)"
      (closed)="closeForm()"
      (deleteRequested)="deleting.set($event)"
    />
  }
  @if (deleting(); as item) {
    <lp-delete-video [video]="item" (deleted)="deleted($event)" (closed)="deleting.set(null)" />
  }
  @if (notice()) {
    <div class="notice" role="status">
      <span>{{ notice() }}</span
      ><button
        class="lp-icon-button"
        type="button"
        aria-label="Dismiss notification"
        (click)="notice.set('')"
      >
        <svg class="lp-icon" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
  }
</main>
