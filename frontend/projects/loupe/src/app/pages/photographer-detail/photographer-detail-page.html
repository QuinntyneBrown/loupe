<main id="main" class="lp-main">
  <a class="back" routerLink="/photographers"
    ><svg class="lp-icon lp-icon--sm" aria-hidden="true"><use href="#i-chevron-left" /></svg
    >Photographers</a
  ><lp-photographer-detail
    [id]="id()"
    (editRequested)="editing.set($event)"
    (deleteRequested)="deleting.set($event)"
    (linkRequested)="linking.set($event)"
  />
</main>
@if (notice()) {
  <div class="notice" role="status">
    <span>{{ notice() }}</span
    ><button class="lp-icon-button" aria-label="Dismiss" (click)="notice.set('')">
      <svg class="lp-icon lp-icon--sm" aria-hidden="true"><use href="#i-x" /></svg>
    </button>
  </div>
}
@if (linking(); as item) {
  <lp-link-photographer-references [photographer]="item" (closed)="closeLinks($event)" />
}
<lp-unsaved-changes [dirty]="dirty" />
@if (deleting(); as request) {
  <lp-delete-photographer
    [photographer]="request.item"
    [referenceCount]="request.count"
    (closed)="closeDelete()"
    (reviewed)="reviewed($event)"
    (deleted)="deletionComplete()"
  />
}
@if (editing(); as item) {
  <lp-edit-photographer [photographer]="item" (saved)="saved($event)" (closed)="closeEdit()" />
}
